<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fonts, in the HEAD rather than via `@import` in index.css.

      A CSS `@import` of a remote stylesheet is a request the browser cannot discover until
      it has downloaded AND parsed our own CSS — so the critical path was
      html → index.css → fonts.googleapis.com/css → the font files, four serial hops
      before the first heading can paint. Declared here the font CSS is fetched in
      parallel with ours, and `preconnect` gets the TLS handshake to the font host out of
      the way at the same time. On the page people arrive on, that chain was the single
      largest contributor to Largest Contentful Paint.

      Two hosts, both needed: the stylesheet comes from fonts.googleapis.com and the font
      files it references come from fonts.gstatic.com, so preconnecting only the first
      leaves the expensive handshake in the path.

      Self-hosting the two families would remove the third-party hop entirely and is the
      next step; this change needs no new assets in the repository.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&display=swap"
    />
    <title>Nestled — live chat for your website</title>
    <meta
      name="description"
      content="Live chat, live visitors and an AI assistant that answers from your own knowledge base. One snippet, and you are talking to your customers."
    />
    <!--
      Per-page head content is rewritten by scripts/prerender.mjs: the title and description
      above, plus a canonical link, Open Graph and Twitter tags, and JSON-LD, are injected
      before this marker. It is a comment rather than an element so that a page which somehow
      skipped prerendering is still valid HTML.
    -->
    <!--seo-->
    <meta name="theme-color" content="#c67139" />
    <!--
      Where the Google tag goes. Injected at container start by
      scripts/analytics-runtime.sh when GA_MEASUREMENT_ID is set, which is production only —
      staging deliberately has no such variable, so it cannot report into the same property.

      A comment rather than an element, for the same reason as the marker above: a build that
      was never tagged is still valid HTML.

      Below the font stylesheet on purpose. The tag loads `async` wherever it sits, so its
      position barely changes when it EXECUTES — but it does change when the browser discovers
      it, and the stylesheet above should win the race for the first connections. That
      stylesheet is on the LCP path (see the note at the top of this file); analytics is not.

      This marker is also what scopes the tag: it lives in this template only, so the six
      prerendered marketing pages get it and app.html, ops.html and widget.html cannot.
    -->
    <!--analytics-->
  </head>
  <body>
    <!--
      Filled with prerendered markup by scripts/prerender.mjs after the client
      build. Empty here on purpose: this file is the TEMPLATE, and the hashed
      asset tags Vite injects into it are what every generated page reuses.
    -->
    <div id="site-root"></div>
    <script type="module" src="/src/entries/site.tsx"></script>
  </body>
</html>
