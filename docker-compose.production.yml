# ─────────────────────────────────────────────────────────────────────────────
# Nestled — PRODUCTION stack for Coolify
#
# Three services on one private network:
#   web  – nginx serving the built frontend + proxying /api and /ws  (PUBLIC)
#   app  – Fastify backend                                            (internal)
#   migrate – one-shot `prisma migrate deploy`, must succeed before app starts
#   db   – Postgres 16                                                (internal)
#
# Coolify setup:
#   1. New Resource → Docker Compose → point at this file (separate project from
#      staging so its volumes/domain are isolated).
#   2. Set the domain on the `web` service (or SERVICE_FQDN_WEB below) e.g.
#      https://app.nestled.chat
#   3. Add the environment variables listed under `app` in Coolify's env UI.
#      Use STRONG, unique secrets (do NOT reuse staging's).
#   4. Deploy. Seed the first admin via SEED_ADMIN_* (runs once) or:
#        coolify exec app npm run seed
#
# Back up the `nestled_pgdata_prod` volume (Coolify → Storages) on a schedule.
# ─────────────────────────────────────────────────────────────────────────────
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - '80'
    environment:
      # Coolify routes the domain to this service on port 80. IMPORTANT: include
      # the https:// scheme so Coolify provisions a Let's Encrypt certificate —
      # a bare domain is treated as HTTP-only (no SSL). Set it in Coolify's env:
      #   SERVICE_FQDN_WEB_80=https://app.nestled.chat
      - SERVICE_FQDN_WEB_80
    healthcheck:
      # 127.0.0.1 (not localhost) — localhost can resolve to ::1 while nginx
      # listens on IPv4, which makes the check fail and the proxy drop the site.
      # Hit /up (nginx returns 200) — the bare `/` is a 404 (no landing page).
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/up']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Migrations as a RELEASE STEP, not a boot step.
  #
  # Running `migrate deploy` inside the app's own startup is fine with one
  # container and wrong with two: both replicas race the same migration, and a
  # slow one delays every restart behind it. As its own service that must exit
  # successfully first, the ordering is explicit and a failed migration stops the
  # deploy instead of half-starting it.
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'migrate']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-nestled}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nestled}
      # The env schema demands these even for a migration run.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # The migrate service above already ran them.
      MIGRATE_ON_BOOT: 'false'
      NODE_ENV: production
      APP_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-nestled}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nestled}
      # Secrets — set these in Coolify (strong, unique, not shared with staging).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Origins allowed to call the API / open sockets (the widget's host sites).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.nestled.chat,https://ops.nestled.chat,https://widget.nestled.chat,https://nestled.chat}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      # Encrypts the secrets stored in platform_settings. Optional and worth
      # setting: without it a leaked database backup hands over the live Stripe
      # key, which is a different category of problem from leaked chat history.
      #   openssl rand -base64 48
      SETTINGS_KEY: ${SETTINGS_KEY:-}

      # Everything else — AI keys, SMTP, Stripe, GeoIP, VAPID, the public URLs,
      # retention — is configured from the ops panel and stored in the database.
      # Those are settings, not deployment topology, and in the environment each
      # change costs a container restart. The variables still work as a fallback
      # for anyone who prefers config-as-code; they are simply not required.

      # ── One-time bootstrap. Both no-op once their table has a row. ──
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_PLATFORM_EMAIL: ${SEED_PLATFORM_EMAIL:-}
      SEED_PLATFORM_PASSWORD: ${SEED_PLATFORM_PASSWORD:-}
    volumes:
      - nestled_uploads_prod:/data/uploads
      # Optional GeoLite2 DB (read-only); set GEOLITE2_DB_PATH to enable.
      - ./server/geoip:/data/geoip:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nestled}
    volumes:
      - nestled_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      # Target the actual DB (defaults to the user name otherwise, which spams
      # "database ... does not exist" in the logs).
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nestled} -d ${POSTGRES_DB:-nestled}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nestled_pgdata_prod:
  nestled_uploads_prod:
