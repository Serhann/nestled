# ─────────────────────────────────────────────────────────────────────────────
# JetChat — PRODUCTION stack for Coolify
#
# Three services on one private network:
#   web  – nginx serving the built frontend + proxying /api and /ws  (PUBLIC)
#   app  – Fastify backend (Prisma migrate deploy runs on boot)       (internal)
#   db   – Postgres 16                                                (internal)
#
# Coolify setup:
#   1. New Resource → Docker Compose → point at this file (separate project from
#      staging so its volumes/domain are isolated).
#   2. Set the domain on the `web` service (or SERVICE_FQDN_WEB below) e.g.
#      https://chat.jetfood.com
#   3. Add the environment variables listed under `app` in Coolify's env UI.
#      Use STRONG, unique secrets (do NOT reuse staging's).
#   4. Deploy. Seed the first admin via SEED_ADMIN_* (runs once) or:
#        coolify exec app npm run seed
#
# Back up the `jetchat_pgdata_prod` volume (Coolify → Storages) on a schedule.
# ─────────────────────────────────────────────────────────────────────────────
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Coolify binds a domain to this service's port 80. Set the real URL in the
      # Coolify UI (or here) as SERVICE_FQDN_WEB=https://chat.your-domain
      - SERVICE_FQDN_WEB_80
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/']
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-jetchat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jetchat}
      # Secrets — set these in Coolify (strong, unique, not shared with staging).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Origins allowed to call the API / open sockets (the widget's host sites).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.jetfood.com,https://jetfood.com,https://tryjet.io,https://www.tryjet.io}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@jetfood.com}
      GEOLITE2_DB_PATH: ${GEOLITE2_DB_PATH:-}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # First-admin bootstrap (no-op once any agent exists).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    volumes:
      - jetchat_uploads_prod:/data/uploads
      # Optional GeoLite2 DB (read-only); set GEOLITE2_DB_PATH to enable.
      - ./server/geoip:/data/geoip:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jetchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jetchat}
    volumes:
      - jetchat_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jetchat}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jetchat_pgdata_prod:
  jetchat_uploads_prod:
