# ─────────────────────────────────────────────────────────────────────────────
# Nestled — PRODUCTION stack
#
# Four services on one private network. Only ONE of them is public:
#
#   web      nginx: the built frontend, and the proxy for /api, /ws, /platform
#   app      the Fastify backend                                     (internal)
#   migrate  one-shot `prisma migrate deploy`; app waits for it      (internal)
#   db       Postgres 16                                             (internal)
#
# ── Coolify ──────────────────────────────────────────────────────────────────
#
# Set a domain on the `web` service ONLY. Leave `app`, `db` and `migrate` with
# no domain — they are reached over the compose network, and a backend that is
# publicly routable alongside the proxy is a way to reach the API with the
# proxy's rules skipped. (`app` no longer declares EXPOSE, so Coolify should not
# offer it a domain at all; if an older version still does, leave it blank.)
#
# Two layouts, both served by the same image with no extra configuration:
#
#   ONE DOMAIN      chat.example.com
#                   → the app at /app, the ops panel at /ops, the widget at
#                     /widget, marketing at /. Simplest, and what most people
#                     have on day one.
#
#   FOUR SUBDOMAINS example.com, app.example.com, ops.example.com,
#                   widget.example.com — all four on the SAME `web` service
#                   (Coolify accepts a comma-separated list in the Domains
#                   field). nginx dispatches on the leading DNS label; nothing
#                   names a domain, so any domain works.
#
# Prefer four subdomains if you can. The widget document is embedded in your
# customers' pages, and a separate origin is what makes it physically unable to
# read an agent's token out of the app's localStorage. On one domain they share
# an origin and that protection is gone.
#
# Include the scheme in Coolify's domain field (https://…) or it provisions no
# certificate. Whatever you choose, put the same list in ALLOWED_ORIGINS.
#
# After a successful deploy Coolify shows `migrate` as EXITED. That is correct —
# it is a one-shot release step, and the app is configured not to start until it
# has finished. If your Coolify version refuses to consider the stack healthy
# with an exited container, delete the `migrate` service and set
# MIGRATE_ON_BOOT=true on `app` instead; you lose the ordering guarantee, which
# only matters with more than one replica.
#
# Then add the environment variables listed under `app` (there are few — the
# rest of the configuration is in the ops panel at ops.<your-domain>/settings).
#
# Back up the `nestled_pgdata_prod` volume (Coolify → Storages) on a schedule.
# ─────────────────────────────────────────────────────────────────────────────
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - '80'
    environment:
      # Coolify routes your domain(s) to this service on port 80. Set them in the
      # resource's Domains field — one for the path layout, or all four for the
      # subdomain layout. This magic variable is how Coolify injects the value;
      # include the https:// scheme or no certificate is provisioned.
      - SERVICE_FQDN_WEB_80
    healthcheck:
      # 127.0.0.1 (not localhost) — localhost can resolve to ::1 while nginx
      # listens on IPv4, which makes the check fail and the proxy drop the site.
      # /up is answered by nginx itself, so this stays green while the backend is
      # still starting and the proxy is not pulled out from under it.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/up']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Migrations as a RELEASE STEP, not a boot step.
  #
  # Running `migrate deploy` inside the app's own startup is fine with one
  # container and wrong with two: both replicas race the same migration, and a
  # slow one delays every restart behind it. As its own service that must exit
  # successfully first, the ordering is explicit and a failed migration stops the
  # deploy instead of half-starting it.
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'migrate']
    environment:
      NODE_ENV: production
      # A password containing "/", "?" or "#" would end this URL's host portion
      # early — the failure that crash-looped a production deploy. `npm run
      # migrate` percent-encodes the credentials before Prisma sees them
      # (server/src/db/url.ts).
      DATABASE_URL: postgres://${POSTGRES_USER:-nestled}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nestled}
      # Not read by a migration run — it does not load the env schema — but set
      # here so this service's environment matches the app's.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # The migrate service above already ran them.
      MIGRATE_ON_BOOT: 'false'
      NODE_ENV: production
      APP_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-nestled}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nestled}
      # Secrets — set these in Coolify (strong, unique, not shared with staging).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Origins allowed to call the API / open sockets (the widget's host sites).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.nestled.chat,https://ops.nestled.chat,https://widget.nestled.chat,https://nestled.chat}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      # Encrypts the secrets stored in platform_settings. Optional and worth
      # setting: without it a leaked database backup hands over the live Stripe
      # key, which is a different category of problem from leaked chat history.
      #   openssl rand -base64 48
      SETTINGS_KEY: ${SETTINGS_KEY:-}

      # Everything else — AI keys, SMTP, Stripe, GeoIP, VAPID, the public URLs,
      # retention — is configured from the ops panel and stored in the database.
      # Those are settings, not deployment topology, and in the environment each
      # change costs a container restart. The variables still work as a fallback
      # for anyone who prefers config-as-code; they are simply not required.

      # ── One-time bootstrap. Both no-op once their table has a row. ──
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_PLATFORM_EMAIL: ${SEED_PLATFORM_EMAIL:-}
      SEED_PLATFORM_PASSWORD: ${SEED_PLATFORM_PASSWORD:-}
    volumes:
      - nestled_uploads_prod:/data/uploads
      # Optional GeoLite2 DB (read-only); set GEOLITE2_DB_PATH to enable.
      - ./server/geoip:/data/geoip:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nestled}
    volumes:
      - nestled_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      # Target the actual DB (defaults to the user name otherwise, which spams
      # "database ... does not exist" in the logs).
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nestled} -d ${POSTGRES_DB:-nestled}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nestled_pgdata_prod:
  nestled_uploads_prod:
