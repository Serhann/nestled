# JetChat self-hosted stack: Fastify app + Postgres + Prisma.
# One-command bring-up:  docker compose up --build
# Prisma migrations (prisma migrate deploy) run automatically on app boot; seed
# the first admin via SEED_ADMIN_* env or with:  docker compose exec app npm run seed
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jetchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jetchat}
      POSTGRES_DB: ${POSTGRES_DB:-jetchat}
    volumes:
      - jetchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jetchat}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Host port is configurable to avoid clashing with a local Postgres.
    # The app reaches the DB over the compose network regardless.
    ports:
      # Default host port 5544 avoids clashing with a local Postgres on 5432.
      - '${POSTGRES_HOST_PORT:-5544}:5432'

  app:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-jetchat}:${POSTGRES_PASSWORD:-jetchat}@db:5432/${POSTGRES_DB:-jetchat}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.jetfood.com,https://jetfood.com,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@jetfood.com}
      # Point at the mounted GeoLite2 DB (see the volume below); blank = disabled.
      GEOLITE2_DB_PATH: ${GEOLITE2_DB_PATH:-}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Seeds the first admin on boot (no-op once any agent exists).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    volumes:
      # GeoLite2 DB (read-only): place at ./server/geoip/GeoLite2-City.mmdb and
      # set GEOLITE2_DB_PATH=/data/geoip/GeoLite2-City.mmdb.
      - ./server/geoip:/data/geoip:ro
      # Uploaded attachments persist here across restarts.
      - jetchat_uploads:/data/uploads
    ports:
      - '4000:4000'

volumes:
  jetchat_pgdata:
  jetchat_uploads:
