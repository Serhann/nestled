# JetChat frontend + reverse proxy.
# Serves the built MPA (clean paths: /admin, /chat, /demo, /tryjet) and proxies
# the API (/api) and realtime (/ws) to the backend `app` service on the compose
# network. Everything lives under one origin, so the widget is same-origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Coolify's Traefik terminates TLS in front of this; forward the real scheme.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Resolve the backend at REQUEST time (Docker's embedded DNS), not at startup.
  # Using a variable in proxy_pass keeps nginx booting even if `app` isn't up yet
  # — otherwise nginx refuses to start ("host not found in upstream 'app'") and
  # the whole site goes down with it.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $jetchat_app app:4000;

  # ── Backend API ─────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://$jetchat_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 15m; # matches MAX_UPLOAD_BYTES headroom
  }

  # ── Realtime WebSockets (agent firehose, visitor sockets, presence) ──────────
  location /ws/ {
    proxy_pass http://$jetchat_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s; # long-lived sockets
  }

  # Health check straight through to the app.
  location = /healthz {
    proxy_pass http://$jetchat_app/healthz;
  }

  # Hashed build assets — immutable, cache hard.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # embed.js / presence.js and other widget assets must never be stale-cached.
  location ~* ^/(embed|presence|sw)\.js$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # No landing page: the bare domain returns 404 and reveals nothing.
  location = / {
    return 404;
  }

  # MPA clean paths: /admin → /admin.html, /tryjet → /tryjet.html. Anything that
  # doesn't map to a real page 404s (no index.html fallback) so unknown routes
  # never leak a landing page.
  location / {
    try_files $uri $uri.html =404;
  }
}
