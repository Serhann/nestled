# Nestled frontend + reverse proxy.
#
# Four surfaces served from one container. In production each is bound to its own
# subdomain (nestled.chat, app., ops., widget.); the path-prefix layout below also
# works as a single-origin fallback, and the app code never hardcodes either — all
# cross-surface URLs come from src/lib/origins.ts.
#
#   /            marketing (prerendered HTML; Phase 14)
#   /app         customer team app        → app.html   (SPA fallback)
#   /ops         platform/vendor panel    → ops.html   (SPA fallback)
#   /widget      visitor widget + embed.js/presence.js
#
# The widget/app split is not cosmetic: the widget document is embedded in
# arbitrary third-party pages, so keeping it off the app's origin is what makes
# "one widget XSS reads every agent's localStorage token" structurally impossible.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Coolify's Traefik terminates TLS in front of this; forward the real scheme.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Resolve the backend at REQUEST time (Docker's embedded DNS), not at startup.
  # Using a variable in proxy_pass keeps nginx booting even if `app` isn't up yet
  # — otherwise nginx refuses to start ("host not found in upstream 'app'") and
  # the whole site goes down with it.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $nestled_app app:4000;

  # ── Backend API ─────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://$nestled_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 15m; # matches MAX_UPLOAD_BYTES headroom
  }

  # ── Platform (staff) API ────────────────────────────────────────────────────
  # A separate prefix from /api on purpose: the two planes authenticate by
  # different mechanisms and neither reads the other's tokens. Without this block
  # /platform/* fell through to the marketing fallback and the ops panel could
  # sign in nowhere — found by running the built images, not by any test.
  location /platform/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://$nestled_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # ── Realtime WebSockets (agent firehose, visitor sockets, presence) ──────────
  location /ws/ {
    proxy_pass http://$nestled_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s; # long-lived sockets
  }

  # Liveness for the web container itself — answered by nginx directly, with no
  # dependency on the app. Use THIS as the container/Coolify health check path.
  location = /up {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Health check straight through to the app.
  location = /healthz {
    proxy_pass http://$nestled_app/healthz;
  }

  # Hashed build assets — immutable, cache hard.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── Widget surface ──────────────────────────────────────────────────────────
  # Deliberately NO X-Frame-Options here: this document must be framable by
  # customers. embed.js / presence.js / sw.js must never be stale-cached — a
  # customer cannot bust a cache they don't control.
  location ~* ^/(embed|presence|sw)\.js$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /widget {
    add_header Cache-Control "no-store";
    try_files /widget.html =404;
  }

  location /vendor/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
  }

  # ── Customer app (SPA: every sub-path resolves to app.html) ─────────────────
  location /app {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /app.html;
  }

  location = /app.html {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # ── Platform panel (staff only: never indexed, never framed) ────────────────
  location /ops {
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /ops.html;
  }

  location = /ops.html {
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # ── Marketing (prerendered HTML; Phase 14) ──────────────────────────────────
  # Real documents per page, so `/` and `/pricing` are crawlable rather than an
  # empty SPA shell. Unknown paths fall back to the landing page.
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
