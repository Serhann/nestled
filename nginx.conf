# Nestled frontend + reverse proxy.
#
# Four surfaces, one container, and TWO layouts — both supported by this file at
# the same time, with no configuration:
#
#   SUBDOMAIN   app.example.com   ops.example.com   widget.example.com   example.com
#   PATH        example.com/app   example.com/ops   example.com/widget   example.com
#
# Point one domain at this container and you get the path layout. Point four
# subdomains at it and each serves its own surface. Nothing here names a domain,
# so any domain works: the maps below dispatch on the leading DNS LABEL.
#
# Subdomains are the safer layout. The widget document is embedded in arbitrary
# third-party pages, so keeping it off the app's origin is what makes "one widget
# XSS reads every agent's localStorage token" structurally impossible — and on a
# single domain they share an origin, so that property is lost. The frontend
# works out which layout it is in from its own URL (src/lib/origins.ts).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Which document a bare path resolves to, when it is not a real file. On a
# subdomain that is the surface's own SPA shell; otherwise the marketing page.
map $host $surface_document {
  default    /index.html;
  ~^app\.    /app.html;
  ~^ops\.    /ops.html;
  ~^widget\. /widget.html;
}

# nginx omits an add_header whose value is an empty string, which is what makes
# these work as "set this header only on these hosts". Every value is quoted:
# an unquoted map value is a parsing trap that fails silently, and a security
# header that is silently absent is the worst kind of absent.
map $host $surface_frame {
  default    "";
  ~^app\.    "SAMEORIGIN";
  ~^ops\.    "DENY";
  # widget. deliberately absent: that document MUST be framable by customers.
}

map $host $surface_robots {
  default    "";
  ~^app\.    "noindex, nofollow";
  ~^ops\.    "noindex, nofollow";
  ~^widget\. "noindex, nofollow";
}


server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Coolify's Traefik terminates TLS in front of this; forward the real scheme.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Resolve the backend at REQUEST time (Docker's embedded DNS), not at startup.
  # Using a variable in proxy_pass keeps nginx booting even if `app` isn't up yet
  # — otherwise nginx refuses to start ("host not found in upstream 'app'") and
  # the whole site goes down with it.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $nestled_app app:4000;

  # ── Backend API ─────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://$nestled_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 15m; # matches MAX_UPLOAD_BYTES headroom
  }

  # ── Platform (staff) API ────────────────────────────────────────────────────
  # A separate prefix from /api on purpose: the two planes authenticate by
  # different mechanisms and neither reads the other's tokens. Without this block
  # /platform/* fell through to the marketing fallback and the ops panel could
  # sign in nowhere — found by running the built images, not by any test.
  location /platform/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://$nestled_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # ── Realtime WebSockets (agent firehose, visitor sockets, presence) ──────────
  location /ws/ {
    proxy_pass http://$nestled_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s; # long-lived sockets
  }

  # Liveness for the web container itself — answered by nginx directly, with no
  # dependency on the app. Use THIS as the container/Coolify health check path.
  location = /up {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Health check straight through to the app.
  location = /healthz {
    proxy_pass http://$nestled_app/healthz;
  }

  # Hashed build assets — immutable, cache hard.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── Widget surface ──────────────────────────────────────────────────────────
  # Deliberately NO X-Frame-Options here: this document must be framable by
  # customers. embed.js / presence.js / sw.js must never be stale-cached — a
  # customer cannot bust a cache they don't control.
  location ~* ^/(embed|presence|sw)\.js$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /widget {
    add_header Cache-Control "no-store";
    try_files /widget.html =404;
  }

  # Reached directly on widget.<domain>, or by the fallback below. Deliberately
  # NO X-Frame-Options: this document exists to be framed by customers.
  location = /widget.html {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location /vendor/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
  }

  # ── Customer app (SPA: every sub-path resolves to app.html) ─────────────────
  location /app {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /app.html;
  }

  # Headers live on the DOCUMENT, not on the route that fell back to it: a
  # try_files fallback is an internal redirect, and add_header in the location
  # that finally serves the file replaces anything the outer one set. Putting
  # them here is what makes them apply in both layouts.
  location = /app.html {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # SAMEORIGIN, not DENY: the appearance editor previews the real widget in an
    # iframe, and DENY would break its own page.
    add_header X-Frame-Options SAMEORIGIN always;
  }

  # ── Platform panel (staff only: never indexed, never framed) ────────────────
  location /ops {
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /ops.html;
  }

  location = /ops.html {
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # ── Everything else ─────────────────────────────────────────────────────────
  # On the marketing host this serves the prerendered pages: `/pricing` finds
  # `pricing.html`, so it is a crawlable document rather than an empty SPA shell.
  #
  # On app./ops./widget. the same rule lands on that surface's SPA shell, which
  # is what makes a deep link like app.example.com/w/acme/inbox/123 work — and
  # why this is a `try_files` fallback rather than four server blocks naming
  # domains this file cannot know.
  # The bare root needs its own exact match. Left to the rule below, `$uri/index.html`
  # resolves to the marketing page — which exists — so app.example.com/ would have
  # served the landing page instead of the app. The most important URL on each
  # surface, quietly wrong.
  # `try_files` serves a matched file in THIS location's context rather than
  # redirecting into the per-document blocks below, so these two are where the
  # host-based headers have to be set.
  location = / {
    add_header X-Frame-Options $surface_frame always;
    add_header X-Robots-Tag $surface_robots always;
    try_files $surface_document =404;
  }

  location / {
    add_header X-Frame-Options $surface_frame always;
    add_header X-Robots-Tag $surface_robots always;
    try_files $uri $uri.html $uri/index.html $surface_document;
  }
}
