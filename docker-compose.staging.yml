# ─────────────────────────────────────────────────────────────────────────────
# Nestled — STAGING stack
#
# Identical in shape to docker-compose.production.yml; read that file's header
# for the Coolify setup, the two domain layouts, and why `migrate` shows as
# exited after a successful deploy.
#
# Differences here: its own database name and volumes, a 30-day retention
# default, and Stripe TEST keys (entered in the ops panel, not here).
# ─────────────────────────────────────────────────────────────────────────────
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - '80'
    environment:
      # Set the domain(s) on THIS service only. Include the https:// scheme or
      # Coolify provisions no certificate.
      - SERVICE_FQDN_WEB_80
      # The public origin, used at container start to write sitemap.xml and the absolute
      # og:url tags — the only SEO artifacts that cannot be relative. Optional: unset, the
      # pages are still correct and still carry their canonical tags, they just have no
      # sitemap. Set it to the marketing domain WITH the scheme. On Coolify the line above
      # already carries it, so this is for anyone deploying by other means.
      # - SITE_URL=https://example.com
    healthcheck:
      # 127.0.0.1 (not localhost) — localhost can resolve to ::1 while nginx
      # listens on IPv4, which makes the check fail and the proxy drop the site.
      # /up is answered by nginx itself, so this stays green while the backend
      # is still starting and the proxy is not pulled out from under it.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/up']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Migrations as a release step rather than a boot step — see the same service
  # in docker-compose.production.yml for why.
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'migrate']
    environment:
      NODE_ENV: production
      # A password containing "/", "?" or "#" would end this URL's host portion
      # early; `npm run migrate` percent-encodes the credentials before Prisma
      # sees them (server/src/db/url.ts).
      DATABASE_URL: postgres://${POSTGRES_USER:-nestled}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nestled_staging}
      # Not read by a migration run — it does not load the env schema — but set
      # here so this service's environment matches the app's.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # The migrate service above already ran them.
      MIGRATE_ON_BOOT: 'false'
      NODE_ENV: production
      APP_ENV: staging
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-nestled}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nestled_staging}
      # Secrets — set these in Coolify (let it generate strong values).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Origins allowed to call the API / open sockets (the widget's host sites).
      # The widget origin belongs here too — leaving it out makes every widget
      # call fail in the browser with a CORS error that looks like an outage.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.staging.nestled.chat,https://ops.staging.nestled.chat,https://widget.staging.nestled.chat,https://staging.nestled.chat}
      # Behind Cloudflare. See the warning in DEPLOY.md: this asserts the app cannot
      # be reached except through it.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      # Encrypts the secrets stored in platform_settings. Optional and worth
      # setting: without it a leaked database backup hands over the live Stripe
      # key, which is a different category of problem from leaked chat history.
      #   openssl rand -base64 48
      SETTINGS_KEY: ${SETTINGS_KEY:-}

      # Everything else — AI keys, SMTP, Stripe, GeoIP, VAPID, the public URLs,
      # retention — is configured from the ops panel and stored in the database.
      # Those are settings, not deployment topology, and in the environment each
      # change costs a container restart. The variables still work as a fallback
      # for anyone who prefers config-as-code; they are simply not required.

      # ── One-time bootstrap. Both no-op once their table has a row. ──
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_PLATFORM_EMAIL: ${SEED_PLATFORM_EMAIL:-}
      SEED_PLATFORM_PASSWORD: ${SEED_PLATFORM_PASSWORD:-}
    volumes:
      - nestled_uploads_staging:/data/uploads
      # Optional GeoLite2 DB (read-only); set GEOLITE2_DB_PATH to enable.
      - ./server/geoip:/data/geoip:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nestled_staging}
    volumes:
      - nestled_pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      # Target the actual DB (defaults to the user name otherwise, which spams
      # "database ... does not exist" in the logs).
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nestled} -d ${POSTGRES_DB:-nestled_staging}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nestled_pgdata_staging:
  nestled_uploads_staging:
